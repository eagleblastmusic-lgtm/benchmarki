[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bartosz-dev-bridge"
version = "0.3.1"
description = "Bounded ChatGPT-to-local-workspace bridge with project creation, tested edits, and verified fast-forward promotion"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
code-intelligence = ["tree-sitter==0.24.0", "tree-sitter-python==0.23.6"]
gui = ["PySide6-Essentials>=6.10,<6.12"]
gui-spike = ["PySide6-Essentials>=6.10,<6.12"]
release = ["PyInstaller>=6.14,<7"]

[project.scripts]
bdb = "bdb_bridge.cli:main"
bdb-native-host = "bdb_bridge.native_host:main"
bdb-operator = "bdb_operator.cli:main"
bdb-control-center = "bdb_gui.app:main"
bdb-inventory = "bdb_bridge.runtime_inventory:main"
bdb-vnext-manifest = "bdb_vnext.composition:main"
bdb-vnext-bootstrap = "bdb_vnext.bootstrap:main"
bdb-vnext-bootstrap-admin = "bdb_vnext.m11a_bootstrap_admin:main"
bdb-vnext-native-host = "bdb_vnext.m9b_native_host:main"
bdb-vnext-cutover = "bdb_vnext.m11c_cutover_cli:main"
bdb-vnext-artifact = "bdb_vnext.m11c_native_artifact_cli:main"
bdb-vnext-m9a-handoff = "bdb_vnext.m9a_handoff_cli:main"
bdb-vnext-final-prepare = "bdb_vnext.m11c_final_prepare:main"
bdb-vnext-legacy-recovery = "bdb_vnext.m11c_legacy_recovery:main"
bdb-vnext-m12a = "bdb_vnext.m12a_compatibility_zero:main"

[tool.setuptools.packages.find]
include = [
  "bdb_bridge*",
  "bdb_operator*",
  "bdb_gui*",
  "bdb_release*",
  "bdb_bartosz_os*",
  "bdb_shared*",
  "bdb_vnext*",
  "bdb_integrations*",
  "bdb_poc*"
]

[tool.setuptools.package-data]
bdb_vnext = ["browser_identity.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
