name: M11c one-shot preflight repair

on:
  push:
    branches:
      - agent/m11c-final-cutover-source
    paths:
      - '.github/workflows/m11c-preflight-surgery.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11c-final-cutover-source
          fetch-depth: 0

      - name: Apply exact source repair
        run: |
          python scripts/m11c_preflight_surgery.py
          python -m py_compile bdb_vnext/m11c_cutover.py

      - name: Commit repaired source
        run: |
          git config user.name "bdb-vnext-ci"
          git config user.email "bdb-vnext-ci@users.noreply.github.com"
          git rm .github/workflows/m11c-preflight-surgery.yml
          git rm scripts/m11c_preflight_surgery.py
          git add bdb_vnext/m11c_cutover.py
          git commit -m "M11c: preflight all gates before Native route disable"
          git push origin HEAD:agent/m11c-final-cutover-source
