name: M12a Inventory Normalize Once

on:
  pull_request:
    branches: [bdb-vnext]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/m12a-compatibility-zero-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12a-compatibility-zero-gate
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact inventory normalization
        shell: python {0}
        run: |
          from pathlib import Path
          path = Path('bdb_vnext/m12a_closure.py')
          text = path.read_text(encoding='utf-8')
          old = '''        for path in output.splitlines():
            if path in path_set:
                matched.add(path)
                token_hits.setdefault(path, set()).add(token)
'''
          new = '''        prefix = f"{commit}:"
        for raw_path in output.splitlines():
            path = raw_path[len(prefix):] if raw_path.startswith(prefix) else raw_path
            if path in path_set:
                matched.add(path)
                token_hits.setdefault(path, set()).add(token)
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one inventory loop, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Prove focused inventory tests before commit
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pytest -q tests/test_m12a_closure.py -k 'inventory'

      - name: Remove one-shot helper and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/m12a-inventory-normalize-once.yml
          git add bdb_vnext/m12a_closure.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M12a: normalize tree-ish inventory grep paths'
          git push origin HEAD:agent/m12a-compatibility-zero-gate
