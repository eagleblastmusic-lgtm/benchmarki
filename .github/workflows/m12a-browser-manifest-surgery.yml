name: M12a one-time Browser manifest surgery

on:
  push:
    branches: [agent/m12a-compatibility-zero-gate]
    paths: ['.github/workflows/m12a-browser-manifest-surgery.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12a-compatibility-zero-gate
          fetch-depth: 0
      - name: Require canonical Browser client-files schema
        shell: python {0}
        run: |
          from pathlib import Path
          path = Path('bdb_vnext/m12a_compatibility_zero.py')
          text = path.read_text(encoding='utf-8')
          old = '''    try:\n        client_files = json.loads(manifest_raw)\n    except json.JSONDecodeError as exc:\n        raise M12aCompatibilityError("browser_source_invalid", "Browser client file manifest is invalid") from exc\n    if not isinstance(client_files, list) or not client_files or any(not isinstance(item, str) for item in client_files):\n        _fail("browser_source_invalid", "Browser client file manifest has invalid entries")\n\n    legacy_host_hits: list[str] = []'''
          new = '''    try:\n        manifest = json.loads(manifest_raw)\n    except json.JSONDecodeError as exc:\n        raise M12aCompatibilityError("browser_source_invalid", "Browser client file manifest is invalid") from exc\n    if not isinstance(manifest, Mapping) or manifest.get("schema") != "bdb-vnext-browser-client-files-v1":\n        _fail("browser_source_invalid", "Browser client file manifest schema differs")\n    client_files = manifest.get("files")\n    if (\n        not isinstance(client_files, list)\n        or not client_files\n        or any(not isinstance(item, str) or not item or Path(item).name != item for item in client_files)\n        or len(client_files) != len(set(client_files))\n        or "client_files.json" not in client_files\n        or "manifest.json" not in client_files\n        or "transport_worker.js" not in client_files\n    ):\n        _fail("browser_source_invalid", "Browser client file manifest has invalid entries")\n\n    legacy_host_hits: list[str] = []'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Align Browser fixture with canonical schema
        shell: python {0}
        run: |
          from pathlib import Path
          path = Path('tests/test_m12a_compatibility_zero.py')
          text = path.read_text(encoding='utf-8')
          old = '''            "browser_extension_vnext/client_files.json": '["worker.js"]\\n',\n            "browser_extension_vnext/worker.js": ('''
          new = '''            "browser_extension_vnext/client_files.json": (\n                '{"schema":"bdb-vnext-browser-client-files-v1",'\n                '"files":["client_files.json","manifest.json","transport_worker.js"]}\\n'\n            ),\n            "browser_extension_vnext/manifest.json": '{"manifest_version":3}\\n',\n            "browser_extension_vnext/transport_worker.js": ('''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''    assert scan["legacy_native_host_references"] == ["browser_extension_vnext/worker.js"]\n    assert scan["legacy_fallback_enabled"] == ["browser_extension_vnext/worker.js"]'''
          new = '''    assert scan["legacy_native_host_references"] == ["browser_extension_vnext/transport_worker.js"]\n    assert scan["legacy_fallback_enabled"] == ["browser_extension_vnext/transport_worker.js"]'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Compile and run focused Browser scan tests
        run: |
          python -m py_compile bdb_vnext/m12a_compatibility_zero.py
          python -m pytest -q tests/test_m12a_compatibility_zero.py -k browser
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/m12a-browser-manifest-surgery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bdb_vnext/m12a_compatibility_zero.py tests/test_m12a_compatibility_zero.py .github/workflows/m12a-browser-manifest-surgery.yml
          git commit -m 'M12a: scan canonical Browser client-files manifest'
          git push origin HEAD:agent/m12a-compatibility-zero-gate
