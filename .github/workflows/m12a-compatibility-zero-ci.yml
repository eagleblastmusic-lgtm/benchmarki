name: M12a Compatibility Zero CI

on:
  pull_request:
    branches: [bdb-vnext]
    paths:
      - 'bdb_vnext/m12a_*.py'
      - 'bdb_vnext/m11c_active_reader.py'
      - 'bdb_vnext/m9a_handoff.py'
      - 'bdb_vnext/m9b_native_host.py'
      - 'bdb_vnext/m3c_admission.py'
      - 'browser_extension_vnext/**'
      - 'tests/test_m12a_*.py'
      - 'tests/test_m9a_handoff.py'
      - 'tests/test_m9b_native_host.py'
      - 'tests/test_m11c_cutover.py'
      - 'tests/test_vnext_m3c_admission.py'
      - 'docs/LOCAL_BROWSER_BENCHMARK.md'
      - 'scripts/run_local_browser_benchmark.py'
      - 'tests/test_local_browser_benchmark.py'
      - 'pyproject.toml'
      - '.github/workflows/m12a-compatibility-zero-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile M12a and active-runtime sources
        run: >-
          python -m py_compile
          bdb_vnext/m12a_compatibility_zero.py
          bdb_vnext/m12a_closure.py
          bdb_vnext/m11c_active_reader.py
          bdb_vnext/m9a_handoff.py
          bdb_vnext/m9b_native_host.py
          bdb_vnext/m3c_admission.py

      - name: Validate Browser service worker syntax
        run: node --check browser_extension_vnext/transport_worker.js

      - name: Run M12a compatibility-zero and full closure gate
        shell: python {0}
        run: |
          from pathlib import Path
          import subprocess
          import sys
          files = sorted(Path('tests').glob('test_m12a_*.py'))
          assert files, 'M12a test suite is empty'
          print('\n'.join(str(path) for path in files))
          subprocess.run([sys.executable, '-m', 'pytest', '-q', *map(str, files)], check=True)

      - name: Run preserved benchmark harness tests
        run: python -m pytest -q tests/test_local_browser_benchmark.py

      - name: Run authority and Native regression
        run: >-
          python -m pytest -q
          tests/test_m9a_handoff.py
          tests/test_m9b_native_host.py
          tests/test_m11c_cutover.py
          tests/test_vnext_m3c_admission.py

      - name: Prove installed M12a operators
        shell: python {0}
        run: |
          import shutil
          base = shutil.which('bdb-vnext-m12a') or shutil.which('bdb-vnext-m12a.exe')
          closure = shutil.which('bdb-vnext-m12a-closure') or shutil.which('bdb-vnext-m12a-closure.exe')
          assert base, 'installed bdb-vnext-m12a entrypoint is missing'
          assert closure, 'installed bdb-vnext-m12a-closure entrypoint is missing'
          print(base)
          print(closure)

      - name: Prove M12a has no destructive or activation surface
        shell: python {0}
        run: |
          import bdb_vnext.m12a_compatibility_zero as m12a
          import bdb_vnext.m12a_closure as closure
          forbidden = {
              'delete', 'drop', 'contract', 'apply', 'activate', 'switch',
              'maintenance', 'promote', 'install', 'register', 'start', 'stop', 'disable'
          }
          for module in (m12a, closure):
              parser = module._parser()
              actions = set(parser._subparsers._group_actions[0].choices)
              assert actions == {'capture', 'verify'}
              assert actions.isdisjoint(forbidden)
              assert not any(name.startswith(tuple(forbidden)) for name in module.__all__)
          print('PASS: M12a is evidence-only; destructive M12b effects remain unavailable')