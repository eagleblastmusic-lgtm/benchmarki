name: M12a one-time archive proof surgery

on:
  push:
    branches: [agent/m12a-compatibility-zero-gate]
    paths: ['.github/workflows/m12a-archive-proof-surgery.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12a-compatibility-zero-gate
          fetch-depth: 0
      - name: Add public full M9a archive verifier
        shell: python {0}
        run: |
          from pathlib import Path
          path = Path('bdb_vnext/m9a_handoff.py')
          text = path.read_text(encoding='utf-8')
          anchor = '\n\ndef revalidate_side_by_side_digest(\n'
          assert text.count(anchor) == 1
          helper = '''\n\ndef verify_side_by_side_archive(*, runtime_root: str | Path, freeze_digest: str) -> dict[str, Any]:\n    """Read every content-addressed M9a evidence object bound by the archive."""\n\n    runtime = _absolute(runtime_root, field="runtime_root")\n    archive = _archive_for_digest(runtime, freeze_digest)\n    refs = [\n        archive.get("route_evidence_ref"),\n        archive.get("first_probe_ref"),\n        archive.get("second_probe_ref"),\n        archive.get("client_evidence_ref"),\n        freeze_digest,\n    ]\n    if any(not isinstance(ref, str) for ref in refs):\n        _fail("m9a_archive_invalid", "M9a archive evidence references are incomplete")\n    objects = [_read_object(runtime, str(ref)) for ref in refs]\n    first, second, client = objects[1], objects[2], objects[3]\n    if (\n        first.get("schema") != "bdb-vnext-m9a-probe-set-v1"\n        or first.get("phase") != "FIRST"\n        or second.get("schema") != "bdb-vnext-m9a-probe-set-v1"\n        or second.get("phase") != "SECOND"\n        or client.get("schema") != "bdb-vnext-m9a-client-binding-v1"\n    ):\n        _fail("m9a_archive_invalid", "M9a archive referenced evidence identities differ")\n    return {\n        "schema": "bdb-vnext-m9a-archive-verification-v1",\n        "freeze_digest": freeze_digest,\n        "archive_readable": True,\n        "evidence_refs": [str(ref) for ref in refs],\n        "evidence_object_count": len(refs),\n        "legacy_mutation_performed": False,\n        "production_activation_performed": False,\n    }\n'''
          text = text.replace(anchor, helper + anchor)
          old = '    "verify_side_by_side_report",\n]'
          new = '    "verify_side_by_side_archive",\n    "verify_side_by_side_report",\n]'
          assert text.count(old) == 1
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
      - name: Wire archive and M3c admission proofs into M12a
        shell: python {0}
        run: |
          from pathlib import Path
          path = Path('bdb_vnext/m12a_compatibility_zero.py')
          text = path.read_text(encoding='utf-8')
          old = 'from bdb_vnext.m9a_handoff import M9aHandoffError, revalidate_side_by_side_digest'
          new = 'from bdb_vnext.m9a_handoff import M9aHandoffError, revalidate_side_by_side_digest, verify_side_by_side_archive\nfrom bdb_vnext.m3c_admission import scan_supported_vnext_admission_paths'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''    runtime_zero = first == second == freeze_digest\n\n    active_source = _sha40(active.get("source_commit"), "active_source_commit")'''
          new = '''    runtime_zero = first == second == freeze_digest\n    archive_verification = verify_side_by_side_archive(\n        runtime_root=runtime,\n        freeze_digest=freeze_digest,\n    )\n    archive_readable = archive_verification.get("archive_readable") is True\n    admission_scan = scan_supported_vnext_admission_paths()\n    admission_exclusive = (\n        admission_scan.get("pass") is True\n        and admission_scan.get("legacy_paths_supported") is False\n        and admission_scan.get("alternate_accepting_writers") == []\n    )\n\n    active_source = _sha40(active.get("source_commit"), "active_source_commit")'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''        {\n            "bridge_id": "legacy-browser-fallback",\n            "usage_zero": browser_scan["compatibility_usage_zero"],\n            "disposition": "REMOVE_ANY_STALE_FALLBACK_SURFACES_IN_M12B",\n        },\n    ]'''
          new = '''        {\n            "bridge_id": "legacy-browser-fallback",\n            "usage_zero": browser_scan["compatibility_usage_zero"],\n            "disposition": "REMOVE_ANY_STALE_FALLBACK_SURFACES_IN_M12B",\n        },\n        {\n            "bridge_id": "alternate-admission-writers",\n            "usage_zero": admission_exclusive,\n            "disposition": "RETAIN_ONLY_CANONICAL_M3C_WRITER_IN_M12B",\n        },\n    ]'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''    archive_readable = all(\n        (\n            runtime\n            / "evidence"\n            / "m9a-side-by-side"\n            / "objects"\n            / f"{ref[7:]}.json"\n        ).is_file()\n        for ref in (freeze_digest,)\n    )\n    pass_closed = ('''
          new = '''    pass_closed = ('''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''        "archive_readable": archive_readable,\n        "native_route_exclusive": routes.get("legacy_route_present") is False and routes.get("target_registered") is True,\n        "active_python_closure": source_scan,'''
          new = '''        "archive_readable": archive_readable,\n        "m9a_archive_verification": archive_verification,\n        "native_route_exclusive": routes.get("legacy_route_present") is False and routes.get("target_registered") is True,\n        "admission_path_scan": admission_scan,\n        "active_python_closure": source_scan,'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
      - name: Compile patched sources
        run: python -m py_compile bdb_vnext/m9a_handoff.py bdb_vnext/m12a_compatibility_zero.py
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/m12a-archive-proof-surgery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bdb_vnext/m9a_handoff.py bdb_vnext/m12a_compatibility_zero.py .github/workflows/m12a-archive-proof-surgery.yml
          git commit -m 'M12a: verify full archive and canonical admission closure'
          git push origin HEAD:agent/m12a-compatibility-zero-gate
