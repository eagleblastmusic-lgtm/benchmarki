name: BDB vNext Focused CI

on:
  push:
    branches:
      - bdb-vnext
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bdb-vnext-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contracts:
    name: Focused vNext contracts / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile current P1/P2 modules
        run: |
          python -m py_compile \
            bdb_vnext/m5a_effects.py \
            bdb_vnext/m6a_evidence_policy.py \
            bdb_vnext/m6b_check_plan.py \
            bdb_vnext/m6c_validation_authority.py \
            bdb_vnext/m7a_git_cas.py \
            bdb_vnext/m7b_checkout_sync.py

      - name: Run focused P1/P2 contracts
        run: |
          python -m pytest \
            tests/test_vnext_m5a_effects.py \
            tests/test_vnext_m5b_effect_cutover.py \
            tests/test_vnext_m6a_evidence_policy.py \
            tests/test_vnext_m6b_check_plan.py \
            tests/test_vnext_m6c_validation_authority.py \
            tests/test_vnext_m7a_git_cas.py \
            tests/test_vnext_m7b_checkout_sync.py \
            tests/test_vnext_engineering_loop.py \
            -q

      - name: Check committed diff whitespace
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  m6c-windows:
    name: M6c Validation Authority / Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile M6c
        run: python -m py_compile bdb_vnext/m6c_validation_authority.py

      - name: Run M6c authority/bypass contracts
        run: python -m pytest tests/test_vnext_m6c_validation_authority.py -q

  m7a-windows:
    name: M7a Git CAS / Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile M7a
        run: python -m py_compile bdb_vnext/m7a_git_cas.py

      - name: Run M7a Git crash/CAS contracts
        run: python -m pytest tests/test_vnext_m7a_git_cas.py -q

  m7b-windows:
    name: M7b Checkout Sync / Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile M7b
        run: python -m py_compile bdb_vnext/m7b_checkout_sync.py

      - name: Run M7b checkout crash/reconciliation contracts
        run: python -m pytest tests/test_vnext_m7b_checkout_sync.py -q
