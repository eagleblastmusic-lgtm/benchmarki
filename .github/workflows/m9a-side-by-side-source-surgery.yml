name: M9a side-by-side source surgery

on:
  push:
    branches:
      - agent/m9a-final-freeze-evidence

permissions:
  contents: write

jobs:
  integrate-m11c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m9a-final-freeze-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact M11c integration
        run: python scripts/_m9a_integrate_m11c.py
      - name: Commit deterministic source change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_m9a_integrate_m11c.py .github/workflows/m9a-side-by-side-source-surgery.yml
          git add bdb_vnext/m11c_cutover.py
          git commit -m "M9a: bind side-by-side evidence into M11c Windows cutover"
          git push origin HEAD:agent/m9a-final-freeze-evidence
