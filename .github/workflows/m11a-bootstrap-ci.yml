name: M11a Bootstrap CI

on:
  pull_request:
    branches: [bdb-vnext]
    paths:
      - 'bdb_vnext/m11a_*.py'
      - 'bdb_vnext/bootstrap.py'
      - 'bdb_vnext/m9b_*.py'
      - 'scripts/Set-BDBVNextBootstrapAuthorityAcl.ps1'
      - 'schemas/bdb-vnext-bootstrap-*.schema.json'
      - 'tests/test_m11a_*.py'
      - 'tests/test_vnext_bootstrap.py'
      - 'tests/test_m9b_*.py'
      - 'tests/test_vnext_m3a_submission.py'
      - 'tests/test_vnext_m3b_browser_admission.py'
      - 'tests/test_vnext_m3c_admission.py'
      - 'pyproject.toml'
      - '.github/workflows/m11a-bootstrap-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile M11a source
        run: >-
          python -m py_compile
          bdb_vnext/m11a_bootstrap_slots.py
          bdb_vnext/m11a_prepared_activation.py
          bdb_vnext/m11a_windows_tcb.py
          bdb_vnext/m11a_bootstrap_admin.py
          tests/test_m11a_bootstrap_slots.py
          tests/test_m11a_prepared_activation.py
          tests/test_m11a_windows_tcb.py
          tests/test_m11a_bootstrap_admin.py

      - name: Validate M11a JSON schemas
        shell: python {0}
        run: |
          import json
          from pathlib import Path
          for path in (
              Path('schemas/bdb-vnext-bootstrap-slot-manifest-v1.schema.json'),
              Path('schemas/bdb-vnext-bootstrap-slot-state-v1.schema.json'),
              Path('schemas/bdb-vnext-bootstrap-prepared-activation-v1.schema.json'),
              Path('schemas/bdb-vnext-bootstrap-windows-tcb-v1.schema.json'),
          ):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'validated {path}')

      - name: Prepare hosted-Windows Bootstrap TCB fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'BartoszDevBridge-Next\bootstrap'
          ./scripts/Set-BDBVNextBootstrapAuthorityAcl.ps1 `
            -Root $root `
            -Apply `
            -AllowNonProgramDataForTest
          "BDB_VNEXT_TCB_FIXTURE=$root" >> $env:GITHUB_ENV
          "BDB_VNEXT_TCB_PROGRAMDATA=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Run M11a + M1b gate
        run: >-
          python -m pytest -q
          tests/test_m11a_bootstrap_slots.py
          tests/test_m11a_prepared_activation.py
          tests/test_m11a_windows_tcb.py
          tests/test_m11a_bootstrap_admin.py
          tests/test_vnext_bootstrap.py

      - name: Verify installed admin CLI has no activation verb
        shell: python {0}
        run: |
          import argparse
          import bdb_vnext.m11a_bootstrap_admin as admin
          parser = admin._parser()
          action = next(item for item in parser._actions if isinstance(item, argparse._SubParsersAction))
          assert set(action.choices) == {'status', 'verify-tcb', 'prepare'}
          assert 'activate' not in action.choices and 'switch' not in action.choices
          print('Bootstrap admin entrypoint is installed and M11a has no activation verb')

      - name: Run impacted M9b + M3 regression
        run: >-
          python -m pytest -q
          tests/test_m9b_activation.py
          tests/test_m9b_native_host.py
          tests/test_m9b_browser_bundle.py
          tests/test_vnext_m3a_submission.py
          tests/test_vnext_m3b_browser_admission.py
          tests/test_vnext_m3c_admission.py

      - name: Prove no M11a activation export
        shell: python {0}
        run: |
          import bdb_vnext.m11a_bootstrap_slots as slots
          import bdb_vnext.m11a_prepared_activation as prepared
          import bdb_vnext.m11a_windows_tcb as windows_tcb
          import bdb_vnext.m11a_bootstrap_admin as admin
          assert not hasattr(slots, 'activate_candidate_slot')
          assert not hasattr(prepared, 'activate_prepared_candidate')
          assert not hasattr(windows_tcb, 'activate_candidate')
          assert not hasattr(admin, 'activate')
          query_actions = {'activate_candidate': False}
          assert query_actions['activate_candidate'] is False
          print('M11a remains build-only; activation is not exported')
