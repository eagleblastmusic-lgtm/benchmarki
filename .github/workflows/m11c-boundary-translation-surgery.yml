name: M11c one-shot boundary translation repair

on:
  push:
    branches:
      - agent/m11c-final-cutover-source
    paths:
      - '.github/workflows/m11c-boundary-translation-surgery.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11c-final-cutover-source
          fetch-depth: 0

      - name: Apply typed boundary repair
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path('bdb_vnext/m11c_cutover.py')
          source = path.read_text(encoding='utf-8')

          old_import = 'from bdb_vnext.bootstrap import (\n    BootstrapLock,\n'
          new_import = 'from bdb_vnext.bootstrap import (\n    BootstrapError,\n    BootstrapLock,\n'
          assert source.count(old_import) == 1
          source = source.replace(old_import, new_import, 1)

          old_block = '''    try:\n        require_client_verification(\n            runtime_root=runtime,\n            expected_client_plan_sha256=plan["client_plan_sha256"],\n        )\n    except M11cClientError as exc:\n        raise M11cCutoverError(exc.code, str(exc)) from exc\n'''
          new_block = '''    try:\n        require_client_verification(\n            runtime_root=runtime,\n            expected_client_plan_sha256=plan["client_plan_sha256"],\n        )\n    except (M11cClientError, BootstrapError) as exc:\n        raise M11cCutoverError(exc.code, str(exc)) from exc\n'''
          count = source.count(old_block)
          assert count >= 1, f'expected at least one client-verification boundary, got {count}'
          source = source.replace(old_block, new_block)

          path.write_text(source, encoding='utf-8', newline='\n')

      - name: Verify typed boundary
        run: |
          python -m py_compile bdb_vnext/m11c_cutover.py
          python - <<'PY'
          from pathlib import Path
          source = Path('bdb_vnext/m11c_cutover.py').read_text(encoding='utf-8')
          assert 'BootstrapError,' in source
          assert 'except (M11cClientError, BootstrapError) as exc:' in source
          PY

      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "bdb-vnext-ci"
          git config user.email "bdb-vnext-ci@users.noreply.github.com"
          git rm .github/workflows/m11c-boundary-translation-surgery.yml
          git add bdb_vnext/m11c_cutover.py
          git commit -m "M11c: translate missing client witness at cutover boundary"
          git push origin HEAD:agent/m11c-final-cutover-source
