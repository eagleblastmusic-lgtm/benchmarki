name: M11b Windows Fault Stress

on:
  pull_request:
    branches: [bdb-vnext]
    paths:
      - 'bdb_vnext/m11b_*.py'
      - 'tests/test_m11b_*.py'
      - '.github/workflows/m11b-windows-stress-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-stress:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Repeat disposable crash and lock matrix
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "=== M11b Windows stress iteration $_ ==="
            python -m pytest -q `
              tests/test_m11b_fault_matrix.py `
              tests/test_m11b_windows_faults.py
            if ($LASTEXITCODE -ne 0) {
              throw "M11b Windows stress iteration $_ failed"
            }
          }

      - name: Repeat frozen catalog validation
        run: python -m pytest -q tests/test_m11b_fault_catalog.py
