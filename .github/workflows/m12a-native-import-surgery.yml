name: M12a one-time Native import surgery

on:
  push:
    branches: [agent/m12a-compatibility-zero-gate]
    paths: ['.github/workflows/m12a-native-import-surgery.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12a-compatibility-zero-gate
          fetch-depth: 0
      - name: Replace broad M11c import with read-only ACTIVE reader
        shell: python {0}
        run: |
          from pathlib import Path
          path = Path('bdb_vnext/m9b_native_host.py')
          text = path.read_text(encoding='utf-8')
          old = 'from bdb_vnext.m11c_cutover import M11cCutoverError, observe_bootstrap_activation, require_bootstrap_active'
          new = 'from bdb_vnext.m11c_active_reader import M11cActiveReadError, observe_bootstrap_activation, require_bootstrap_active'
          assert text.count(old) == 1, 'expected exactly one broad M11c import'
          text = text.replace(old, new)
          count = text.count('M11cCutoverError')
          assert count >= 2, f'expected M11cCutoverError catch sites, found {count}'
          text = text.replace('M11cCutoverError', 'M11cActiveReadError')
          path.write_text(text, encoding='utf-8')
      - name: Prove no broad M11c import remains
        shell: python {0}
        run: |
          from pathlib import Path
          text = Path('bdb_vnext/m9b_native_host.py').read_text(encoding='utf-8')
          assert 'from bdb_vnext.m11c_cutover import' not in text
          assert 'from bdb_vnext.m11c_active_reader import' in text
          assert 'M11cCutoverError' not in text
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/m12a-native-import-surgery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bdb_vnext/m9b_native_host.py .github/workflows/m12a-native-import-surgery.yml
          git commit -m 'M12a: isolate Native Host from migration-only M11c imports'
          git push origin HEAD:agent/m12a-compatibility-zero-gate
